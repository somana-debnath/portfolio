<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A glove with small sensor dots on each finger">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE4EA"/>
      <stop offset="1" stop-color="#F6E9DD"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B4C4"/>
      <stop offset="1" stop-color="#D894AC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="640" cy="110" r="120" fill="#FFF8F6" opacity="0.6"/>
  <circle cx="130" cy="420" r="90" fill="#FFF8F6" opacity="0.5"/>

  <!-- signal arcs -->
  <g fill="none" stroke="#D4A373" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M560 150 a40 40 0 0 1 40 40"/>
    <path d="M560 120 a70 70 0 0 1 70 70"/>
    <path d="M560 90 a100 100 0 0 1 100 100" opacity="0.6"/>
  </g>

  <g transform="translate(400 270) rotate(-8) translate(-400 -270)">
    <!-- fingers -->
    <g fill="url(#glove)" stroke="#C2698A" stroke-width="4" stroke-linejoin="round">
      <rect x="298" y="118" width="46" height="150" rx="23"/>
      <rect x="352" y="88" width="48" height="180" rx="24"/>
      <rect x="408" y="98" width="48" height="170" rx="24"/>
      <rect x="464" y="130" width="44" height="140" rx="22"/>
      <rect x="0" y="0" width="44" height="130" rx="22" transform="translate(236 250) rotate(-38)"/>
      <!-- palm -->
      <path d="M292 230 h220 v110 q0 60 -60 70 h-100 q-60 -10 -60 -70 z"/>
    </g>
    <!-- cuff -->
    <rect x="318" y="398" width="170" height="52" rx="16" fill="#C2698A"/>
    <g stroke="#FFF8F6" stroke-width="3" opacity="0.55">
      <path d="M340 410 v28M362 410 v28M384 410 v28M406 410 v28M428 410 v28M450 410 v28M472 410 v28"/>
    </g>

    <!-- wires -->
    <g fill="none" stroke="#4A2C3A" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.6">
      <path d="M321 150 V300 Q330 330 380 340"/>
      <path d="M376 118 V320"/>
      <path d="M432 128 V320"/>
      <path d="M486 160 V300 Q480 330 440 340"/>
    </g>

    <!-- ESP32 board -->
    <rect x="360" y="300" width="88" height="62" rx="10" fill="#4A2C3A"/>
    <rect x="378" y="314" width="52" height="34" rx="5" fill="#8A6475"/>
    <circle cx="436" cy="310" r="4" fill="#D4A373"/>

    <!-- sensor dots -->
    <g fill="#FFF8F6" stroke="#D4A373" stroke-width="4">
      <circle cx="321" cy="146" r="9"/>
      <circle cx="321" cy="200" r="7"/>
      <circle cx="376" cy="116" r="9"/>
      <circle cx="376" cy="176" r="7"/>
      <circle cx="432" cy="126" r="9"/>
      <circle cx="432" cy="184" r="7"/>
      <circle cx="486" cy="158" r="9"/>
      <circle cx="486" cy="210" r="7"/>
      <circle cx="262" cy="282" r="9"/>
    </g>
  </g>

  <!-- floating letters -->
  <g font-family="Georgia, 'Playfair Display', serif" font-style="italic" fill="#9B3F62">
    <text x="612" y="300" font-size="56">a</text>
    <text x="662" y="350" font-size="44" opacity="0.75">s</text>
    <text x="700" y="290" font-size="40" opacity="0.55">l</text>
  </g>
</svg>
